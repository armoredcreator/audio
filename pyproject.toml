[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armoredspeech-lab"
version = "0.1.0"
description = "Shared Python environment for isolated ArmoredSpeech and ArmoredStudio validation"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless==4.10.0.84",
    "imageio-ffmpeg==0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ArmoredSpeech*", "ArmoredStudio*", "armored_core*"]
exclude = [".venv*", "venv*", ".git*", "__pycache__*", ".pytest_cache*", "build*", "dist*", "storage*", "credentials*", "ArmoredStudio.runtime*", "ArmoredSpeech.runtime*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ArmoredSpeech/tests"]
