name: ArmoredSpeech isolated tests

on:
  push:
    paths:
      - "armoredspeech/**"
      - "tests/test_armoredspeech_*.py"
      - ".github/workflows/armoredspeech-tests.yml"
  pull_request:
    paths:
      - "armoredspeech/**"
      - "tests/test_armoredspeech_*.py"
      - ".github/workflows/armoredspeech-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_armoredspeech_*.py
