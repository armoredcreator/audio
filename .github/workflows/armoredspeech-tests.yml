name: ArmoredSpeech isolated tests

on:
  push:
    paths:
      - "ArmoredSpeech/**"
      - "ArmoredStudio/**"
      - "pyproject.toml"
      - ".github/workflows/armoredspeech-tests.yml"
  pull_request:
    paths:
      - "ArmoredSpeech/**"
      - "pyproject.toml"
      - ".github/workflows/armoredspeech-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest imageio-ffmpeg
      - run: python -m compileall -q ArmoredSpeech ArmoredStudio armored_core
      - run: python -m pytest -q
