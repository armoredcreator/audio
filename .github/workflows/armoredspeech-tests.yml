name: ArmoredSpeech isolated tests

on:
  push:
    paths:
      - "ArmoredSpeech/**"
      - "ArmoredStudio/**"
      - "ArmoredSync/**"
      - "ArmoredVision/**"
      - "ArmoredStock/**"
      - "ArmoredIA/**"
      - "tests/**"
      - "armored_core/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - "ArmoredSpeech/README.md"
      - "docs/**"
      - ".github/workflows/armoredspeech-tests.yml"
  pull_request:
    paths:
      - "ArmoredSpeech/**"
      - "ArmoredStudio/**"
      - "ArmoredSync/**"
      - "ArmoredVision/**"
      - "ArmoredStock/**"
      - "ArmoredIA/**"
      - "tests/**"
      - "armored_core/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - "ArmoredSpeech/README.md"
      - "docs/**"
      - ".github/workflows/armoredspeech-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q ArmoredSpeech ArmoredStudio armored_core ArmoredSync ArmoredVision ArmoredStock ArmoredIA tests
      - run: python -m pytest -q
