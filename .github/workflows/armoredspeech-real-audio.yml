name: ArmoredSpeech real-audio diagnostics

on:
  push:
    branches:
      - refactor/ArmoredSpeech-directory-20261015
      - test/armoredstudio-speech-integration-20261015
    paths:
      - "ArmoredSpeech/tests/diagnose_real_audio.py"
      - "ArmoredSpeech/tests/validate_real_audio.py"
      - "ArmoredSpeech/audio_intelligence.py"
      - "ArmoredSpeech/model_processor.py"
      - "ArmoredSpeech/contracts.py"
      - ".github/workflows/armoredspeech-real-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Detect private real-audio corpus
        id: corpus
        shell: bash
        run: |
          missing=0
          for file in 291_6VKD4FrQVJ.mp4 1046_20uhmSz3VE.mp4 12008_1AyNNNzh3.mp4 12025_7ptrS9Gsg2.mp4 178482_7AeDXQWFF2.mp4; do
            if ! find . -type f -name "$file" -print -quit | grep -q .; then
              echo "Missing private corpus file: $file"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private audio corpus is not present in this checkout; real-media checks will be skipped, not reported as passed."
          fi
      - uses: actions/setup-python@v5
        if: steps.corpus.outputs.present == 'true'
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        if: steps.corpus.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install CPU analysis dependencies
        if: steps.corpus.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.6 safetensors numpy faster-whisper==1.2.1 silero-vad==6.2.3
      - name: Inspect original video hashes and AudioSet labels
        if: steps.corpus.outputs.present == 'true'
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
          ARMORED_AUDIO_MODEL_CACHE: ${{ runner.temp }}/audio-model-cache
          ARMORED_AUDIO_LANGUAGE_MODEL: tiny
          ARMORED_AUDIO_COMPUTE_TYPE: int8
          ARMORED_AUDIO_CONTENT_NOISE_THRESHOLD: "0.05"
        run: |
          python ArmoredSpeech/tests/diagnose_real_audio.py
          python ArmoredSpeech/tests/validate_real_audio.py
